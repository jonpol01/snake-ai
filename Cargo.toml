[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "snake-ai"
version = "0.2.0"
edition = "2021"

[lib]
name = "snake_ai"
path = "src/lib.rs"

[[bin]]
name = "snake-ai"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
wgpu = { version = "24", features = ["wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
futures = "0.3"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
tiny-skia = "0.11"
resvg = "0.44"
usvg = "0.44"

[profile.release]
opt-level = 3
lto = true
